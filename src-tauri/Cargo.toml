[package]
name = "amstal-terminal"
version = "1.3.0"
description = "Amstal Desktop Financial Workstation"
authors = ["Amstal Quant Team"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
duckdb = { version = "1.0", features = ["bundled"] }
interprocess = "2.2"
futures-util = "0.3"
tokio-tungstenite = "0.23"
